name: Test Basecracker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check browser modules
        run: |
          node --check src/app.js
          node --check src/model.js
          node --check src/legality.js
          node --check src/rulesets/th7.js
          node --check src/rulesets/th7-combat.js
          node --check src/combat/kernel.js
          node --check src/evidence/registry.js
          node --check src/evidence/validate.js
          node --check evidence-lab/static/core.js
          node --check evidence-lab/static/app.js
      - name: Check Evidence Lab server
        run: |
          python -m py_compile evidence-lab/server.py
          python -m unittest discover -s evidence-lab/tests -p 'test_*.py'
      - name: Run deterministic tests
        run: npm test
